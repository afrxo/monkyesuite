# monkye-events — Railway cron service.
#
# On the monkye-events service, set:
#   Config-as-code path = apps/worker/cron/events.railway.toml
#
# Every hour — one full sweep of tracked games. Matches the update_shipped
# emission window (~1h) exactly, so no event goes undetected within its
# window on the outbound side.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"
watchPatterns = ["apps/worker/**"]

[deploy]
startCommand = "/events"
restartPolicyType = "NEVER"
numReplicas = 1
cronSchedule = "13 * * * *"
