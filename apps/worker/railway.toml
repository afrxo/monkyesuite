# monkye-worker — Railway config-as-code (specs/10-deployment.md §5)
#
# In the monkye-worker service settings set:
#   Root Directory     = /
#   Config-as-code path = apps/worker/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/worker/Dockerfile"
# Worker-only. It is a separate Go module that imports no TS package; the only
# thing it shares with the API is the database, and it never migrates.
watchPatterns = ["apps/worker/**"]

[deploy]
# No healthcheckPath: the worker exposes no HTTP. Railway would fail the deploy
# waiting on a port that never opens. Health is `job_runs` rows (specs/09).
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
