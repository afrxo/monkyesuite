# monkye-api — Railway config-as-code (specs/10-deployment.md §5)
#
# One file per service: Railway resolves a single service from a config file, so
# the two services cannot share a root railway.toml. In the monkye-api service
# settings set:
#   Root Directory     = /              (the pnpm workspace needs the root lockfile)
#   Config-as-code path = apps/api/railway.toml
# The config path is resolved from the repo root and does NOT follow Root Directory.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# packages/** is in here because the API imports @monkyesuite/{core,database,shared}
# as source, and because a schema change must redeploy the API — the API start
# command is what runs migrations.
watchPatterns = ["apps/api/**", "packages/**", "pnpm-lock.yaml"]

[deploy]
# /health is unauthenticated and registered before /v1 in apps/api/src/app.ts.
healthcheckPath = "/health"
# Generous: the container runs the full migration chain (functions → schema →
# roles) before it starts listening, and a cold first deploy applies every
# migration at once.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
